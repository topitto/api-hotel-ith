<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel ITH - Sistema de Reservaciones</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

    <header class="bg-primary text-white text-center py-4 mb-4" style="background: linear-gradient(90deg, #0d6efd, #00d2ff);">
        <h2>Sistema de Reservaciones en Línea</h2>
        <p class="lead mb-0">Panel de Control - Hotel ITH</p>
    </header>

    <div class="container">
        <ul class="nav nav-tabs" id="hotelTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="habitaciones-tab" data-bs-toggle="tab" data-bs-target="#habitaciones" type="button" role="tab">
                    🏨 Habitaciones y Reservas
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="mi-reservacion-tab" data-bs-toggle="tab" data-bs-target="#mi-reservacion" type="button" role="tab">
                    🔍 Mi Reservación
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="administracion-tab" data-bs-toggle="tab" data-bs-target="#administracion" type="button" role="tab">
                    ⚙️ Administración
                </button>
            </li>
        </ul>

        <div class="tab-content bg-white p-4 border border-top-0 rounded-bottom shadow-sm mb-5" id="hotelTabsContent">
            
            <div class="tab-pane fade show active" id="habitaciones" role="tabpanel">
                <button class="btn btn-primary mb-4 fw-bold" onclick="cargarHabitaciones()">
                    🔄 Actualizar Disponibilidad
                </button>
                
                <div id="listaHabitaciones" class="row g-4">
                </div>
            </div>

            <div class="tab-pane fade" id="mi-reservacion" role="tabpanel">
                <div class="card shadow-sm border-info w-50">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">Consultar Estado de Reservación</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Código de Reservación:</label>
                            <input type="text" id="txtBuscarReserva" class="form-control" placeholder="Ej. JUAN-101">
                        </div>
                        <button class="btn btn-info text-white fw-bold w-100" onclick="buscarReservacion()">Buscar Detalles</button>
                    </div>
                </div>
                <div id="resultadoReservacion" class="mt-4"></div>
            </div>

            <div class="tab-pane fade" id="administracion" role="tabpanel">
                <div class="row g-4">
                    
                    <div class="col-md-6">
                        <div class="card shadow-sm border-warning h-100">
                            <div class="card-header bg-warning">
                                <h5 class="mb-0 text-dark">🧹 Actualizar Limpieza (Estado)</h5>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">ID Habitación:</label>
                                    <input type="text" id="txtIdEstado" class="form-control" placeholder="ej. HAB-101">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Nuevo Estado:</label>
                                    <select id="txtNuevoEstado" class="form-select">
                                        <option value="Limpia">Limpia</option>
                                        <option value="Sucia">Sucia</option>
                                        <option value="Mantenimiento">Mantenimiento</option>
                                    </select>
                                </div>
                                <button class="btn btn-warning w-100 fw-bold" onclick="actualizarEstado()">Guardar Estado</button>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card shadow-sm border-danger h-100">
                            <div class="card-header bg-danger text-white">
                                <h5 class="mb-0">🚪 Realizar Check-out</h5>
                            </div>
                            <div class="card-body d-flex flex-column">
                                <p class="text-muted small mb-4">Esta acción eliminará la reservación activa y cambiará el estado de la habitación a "Limpia" automáticamente.</p>
                                
                                <div class="mb-4">
                                    <label class="form-label fw-bold">ID de la Habitación a liberar:</label>
                                    <input type="text" id="txtDesocuparId" class="form-control bg-light" placeholder="ej. HAB-101">
                                </div>
                                
                                <button class="btn btn-danger w-100 fw-bold mt-auto" onclick="desocuparHabitacion()">
                                    Desocupar y Borrar Reservación
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js">
        // =================================================================
        // ¡IMPORTANTE! CONFIGURACIÓN DE LA URL DE TU API
        // =================================================================
        
        // 1. Usa esta línea cuando ya hayas subido tu API a Render:
        const API_URL = "https://api-hotel-ith.onrender.com/api/v1";
        // 2. Si quieres probar en tu computadora primero, usa esta:
        //const API_URL = "http://127.0.0.1:8000/api/v1";

        // =================================================================

        // Cargar habitaciones al iniciar
        document.addEventListener("DOMContentLoaded", cargarHabitaciones);

        async function cargarHabitaciones() {
            try {
                const response = await fetch(`${API_URL}/habitaciones`);
                const json = await response.json();
                const contenedor = document.getElementById("contenedor-habitaciones");
                contenedor.innerHTML = "";

                if(json.datos.length === 0) {
                    contenedor.innerHTML = "<p class='text-muted'>No hay habitaciones registradas.</p>";
                    return;
                }

                json.datos.forEach(hab => {
                    const badgeColor = hab.estado === 'Limpia' ? 'bg-success' : (hab.estado === 'Ocupada' ? 'bg-danger' : 'bg-warning');
                    const btnHtml = hab.estado === 'Limpia' 
                        ? `<button class="btn btn-primary w-100 mt-2" onclick="abrirModalReserva('${hab.id_habitacion}')">Reservar</button>`
                        : `<button class="btn btn-secondary w-100 mt-2" disabled>No Disponible</button>`;

                    contenedor.innerHTML += `
                        <div class="col-md-4 mb-3">
                            <div class="card card-habitacion h-100 shadow-sm">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h5 class="card-title mb-0">Hab. ${hab.numero}</h5>
                                        <span class="badge ${badgeColor}">${hab.estado}</span>
                                    </div>
                                    <h6 class="card-subtitle mb-2 text-muted">${hab.tipo} - Piso ${hab.piso}</h6>
                                    <h4 class="text-primary">$${hab.precio_noche}<small class="text-muted fs-6">/noche</small></h4>
                                    ${btnHtml}
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                alert("Error de conexión. Revisa que la URL de tu API sea correcta y el servidor esté corriendo.");
                console.error(error);
            }
        }

        function abrirModalReserva(idHabitacion) {
            document.getElementById("res-id-hab").value = idHabitacion;
            const modal = new bootstrap.Modal(document.getElementById('modalReserva'));
            modal.show();
        }

        async function crearReservacion(e) {
            e.preventDefault();
            const payload = {
                id_habitacion: document.getElementById("res-id-hab").value,
                huesped: document.getElementById("res-huesped").value,
                fecha_inicio: document.getElementById("res-inicio").value,
                fecha_fin: document.getElementById("res-fin").value,
                total_estancia: parseFloat(document.getElementById("res-total").value)
            };

            try {
                const response = await fetch(`${API_URL}/reservaciones`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if(response.ok) {
                    alert(`¡Reservación Exitosa! Tu código es: ${data.datos.id_reservacion}`);
                    bootstrap.Modal.getInstance(document.getElementById('modalReserva')).hide();
                    document.getElementById("form-reserva").reset();
                    cargarHabitaciones(); 
                } else {
                    alert(`Error: ${data.detail}`);
                }
            } catch (error) {
                alert("Ocurrió un error al intentar comunicar con el servidor.");
            }
        }

        async function consultarReservacion() {
            const id = document.getElementById("consulta-id").value;
            const resultado = document.getElementById("resultado-consulta");
            
            try {
                const response = await fetch(`${API_URL}/reservaciones/${id}`);
                const data = await response.json();

                if(response.ok) {
                    resultado.innerHTML = `
                        <div class="alert alert-success">
                            <strong>Huésped:</strong> ${data.datos.huesped}<br>
                            <strong>Habitación:</strong> ${data.datos.id_habitacion}<br>
                            <strong>Check-in:</strong> ${data.datos.fecha_inicio}<br>
                            <strong>Total:</strong> $${data.datos.total_estancia}
                        </div>
                    `;
                } else {
                    resultado.innerHTML = `<div class="alert alert-danger">${data.detail}</div>`;
                }
            } catch (error) {
                resultado.innerHTML = `<div class="alert alert-danger">Error de conexión.</div>`;
            }
        }

        async function crearHabitacion(e) {
            e.preventDefault();
            const payload = {
                numero: document.getElementById("hab-numero").value,
                tipo: document.getElementById("hab-tipo").value,
                precio_noche: parseFloat(document.getElementById("hab-precio").value),
                piso: parseInt(document.getElementById("hab-piso").value)
            };

            try {
                const response = await fetch(`${API_URL}/habitaciones`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if(response.ok) {
                    alert("Habitación creada correctamente.");
                    document.getElementById("form-habitacion").reset();
                    cargarHabitaciones();
                } else {
                    alert(`Error: ${data.detail}`);
                }
            } catch (error) {
                alert("Ocurrió un error al intentar comunicar con el servidor.");
            }
        }

        async function cambiarEstado(e) {
            e.preventDefault();
            const id = document.getElementById("estado-id").value;
            const nuevoEstado = document.getElementById("estado-nuevo").value;

            try {
                const response = await fetch(`${API_URL}/habitaciones/${id}/estado`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nuevo_estado: nuevoEstado })
                });

                const data = await response.json();
                if(response.ok) {
                    alert("Estado actualizado.");
                    document.getElementById("form-estado").reset();
                    cargarHabitaciones();
                } else {
                    alert(`Error: ${data.detail}`);
                }
            } catch (error) {
                alert("Ocurrió un error al intentar comunicar con el servidor.");
            }
        }
        async function desocuparHabitacion() {
                const idHabitacion = document.getElementById("txtDesocuparId").value.trim();

                    if (!idHabitacion) {
                        alert("Por favor, ingresa el ID de la habitación (ej. HAB-101).");
                    return;
                    }

            try {
                // Hacemos la petición POST al nuevo endpoint de la API
                const response = await fetch(`${API_URL}/habitaciones/${idHabitacion}/desocupar`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.mensaje);
                    document.getElementById("txtDesocuparId").value = "";
                    
                    // Si tu app tiene una función para actualizar la lista de habitaciones en pantalla, ejecútala aquí:
                    if (typeof cargarHabitaciones === "function") {
                        cargarHabitaciones();
                    }
                } else {
                    // Muestra el error específico que mande la API (ej. "La habitación no está ocupada")
                    alert(`Error: ${result.detail || "No se pudo procesar el check-out."}`);
                }
                    } catch (error) {
                        console.error("Error en la conexión:", error);
                        alert("Hubo un error de red al intentar conectar con el servidor.");
                    }
        }
    </script>
</body>
</html>
